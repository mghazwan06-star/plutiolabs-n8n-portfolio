<rect x="60" y="80.0" width="680" height="186" rx="8" fill="#cfe4ff" fill-opacity="0.55" stroke="#d8cf7a" stroke-opacity="0.6"/>
<text x="72" y="104.0" font-size="13.5" font-weight="700" fill="#5f5930">D5-WF1 — Lead Scanner &amp; Enqueue</text>
<text x="72" y="121.0" font-size="11.5" fill="#6f6840">Runs daily at 09:00 GMT/BST. Scans the Clients tab for idle leads (30+ days cold) and</text>
<text x="72" y="135.0" font-size="11.5" fill="#6f6840">writes qualifying leads to the Reactivation Log with status=queued.</text>
<text x="72" y="149.0" font-size="11.5" fill="#6f6840">Idle pool: Status IN (unresponsive, called, voicemail, no-answer)</text>
<text x="72" y="163.0" font-size="11.5" fill="#6f6840">Excludes: do-not-contact, not-interested, booked, sequence-active, call-initiated,</text>
<text x="72" y="177.0" font-size="11.5" fill="#6f6840">inbound-incomplete, SMS Opt-Out=Y, already active in Reactivation Log</text>
<text x="72" y="191.0" font-size="11.5" fill="#6f6840">Dedup: Skips phones already in Reactivation Log with active/terminal status — call-failed</text>
<text x="72" y="205.0" font-size="11.5" fill="#6f6840">is intentionally EXCLUDED so those leads can be re-enqueued after a VAPI fire failure</text>
<text x="72" y="219.0" font-size="11.5" fill="#6f6840">Priority: Sorted by retention deadline (soonest expiry first)</text>
<text x="72" y="233.0" font-size="11.5" fill="#6f6840">Downstream: D5-WF2 (Voice Engine) polls Reactivation Log for queued leads.</text>
<g fill="none" stroke="#9aa0a6" stroke-width="2.5">

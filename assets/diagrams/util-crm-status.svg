<rect x="-20" y="60.0" width="720" height="141" rx="8" fill="#fff8b8" fill-opacity="0.55" stroke="#d8cf7a" stroke-opacity="0.6"/>
<text x="-8" y="84.0" font-size="13.5" font-weight="700" fill="#5f5930">CRM Status (read-only)</text>
<text x="-8" y="101.0" font-size="11.5" fill="#6f6840">POST /webhook/crm-status — answers &quot;what is actually in the CRM right now?&quot;</text>
<text x="-8" y="115.0" font-size="11.5" fill="#6f6840">Complements CRM Integrity Check, which reports row counts and per-column FILL RATES.</text>
<text x="-8" y="129.0" font-size="11.5" fill="#6f6840">This one reports distributions and, most importantly, how many leads are send-ready per</text>
<text x="-8" y="143.0" font-size="11.5" fill="#6f6840">template.</text>
<text x="-8" y="157.0" font-size="11.5" fill="#6f6840">Reads by HEADER NAME, so reordering columns cannot corrupt the report.</text>
<text x="-8" y="171.0" font-size="11.5" fill="#6f6840">Writes nothing. Safe to run at any time.</text>
<g fill="none" stroke="#9aa0a6" stroke-width="2.5">

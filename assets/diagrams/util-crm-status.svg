<text x="-8" y="84" font-size="13.5" font-weight="700" fill="#5f5930">CRM Status (read-only)</text>
<text x="-8" y="101" font-size="11.5" fill="#6f6840">POST /webhook/crm-status — answers &quot;what is actually in the CRM right now?&quot;</text>
<text x="-8" y="115" font-size="11.5" fill="#6f6840">Complements CRM Integrity Check, which reports row counts and per-column FILL RATES.</text>
<text x="-8" y="129" font-size="11.5" fill="#6f6840">This one reports distributions and, most importantly, how many leads are send-ready per</text>
<text x="-8" y="143" font-size="11.5" fill="#6f6840">template.</text>
<text x="-8" y="157" font-size="11.5" fill="#6f6840">Reads by HEADER NAME, so reordering columns cannot corrupt the report.</text>
<text x="-8" y="171" font-size="11.5" fill="#6f6840">Writes nothing. Safe to run at any time.</text>
<g fill="none" stroke="#9aa0a6" stroke-width="2.5">

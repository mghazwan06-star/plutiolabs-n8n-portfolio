<text x="292" y="95" font-size="11.5" fill="#6f6840">Input: { toolInput: { newDate: &#x27;YYYY-MM-DD&#x27;, newTime: &#x27;9am|11am|1pm|3pm&#x27; }, toolUseId, phone }</text>
<text x="292" y="109" font-size="11.5" fill="#6f6840">Output: { toolCallId, result }</text>
<text x="292" y="123" font-size="11.5" fill="#6f6840">1. Reads Appointment Log for phone + status=confirmed</text>
<text x="292" y="137" font-size="11.5" fill="#6f6840">2. Computes new ISO start/end (BST-aware)</text>
<text x="292" y="151" font-size="11.5" fill="#6f6840">3. Updates Google Calendar event start/end</text>
<text x="292" y="165" font-size="11.5" fill="#6f6840">4. Updates Appointment Log: Date, Time, AppointmentTimeISO</text>
<text x="292" y="179" font-size="11.5" fill="#6f6840">5. Updates Clients: Upcoming Appointment, Last Contact, Last Channel</text>
<text x="292" y="193" font-size="11.5" fill="#6f6840">⚠️ Credentials: Google Sheets OAuth2 (id: 0d40kOfUWlsFuLuB), Google Calendar OAuth2 (id: Vm9SHjOljbABWWKN)</text>

<text x="72" y="84.0" font-size="13.5" font-weight="700" fill="#5f5930">D5-WF2b — D5 VAPI Event Router</text>
<text x="72" y="101.0" font-size="11.5" fill="#6f6840">Single entry point for all D5 VAPI webhook events.</text>
<text x="72" y="115.0" font-size="11.5" fill="#6f6840">Webhook path: /webhook/d5-vapi-events</text>
<text x="72" y="129.0" font-size="11.5" fill="#6f6840">Sub-workflow IDs:</text>
<text x="72" y="143.0" font-size="11.5" fill="#6f6840">- WF2c-avail (checkAvailability): XYt8y7KMpSArW5bt</text>
<text x="72" y="157.0" font-size="11.5" fill="#6f6840">- WF2c-book (bookAppointment): JYW1eTz4OMiYQxfq</text>
<text x="72" y="171.0" font-size="11.5" fill="#6f6840">- WF2d (Post-Call Processor): wd6OVv9aMwmHVddB</text>
<text x="72" y="185.0" font-size="11.5" fill="#6f6840">- WF2e (Call-Failed Handler): TKqdNUzhzbKzjVHb</text>
<text x="72" y="199.0" font-size="11.5" fill="#6f6840">Event routing:</text>
<text x="72" y="213.0" font-size="11.5" fill="#6f6840">- tool-calls → Extract Tool Data → sync sub-workflow → Validate Response → respond (5s budget)</text>
<text x="72" y="227.0" font-size="11.5" fill="#6f6840">- end-of-call-report → async WF2d → respond 200 immediately</text>
<text x="72" y="241.0" font-size="11.5" fill="#6f6840">- call-failed → async WF2e → respond 200 immediately</text>
<text x="72" y="255.0" font-size="11.5" fill="#6f6840">- other → respond 200</text>
<text x="72" y="269.0" font-size="11.5" fill="#6f6840">Validate Response nodes (mirrors D2-WF2 Handle WF3 Response pattern):</text>
<text x="72" y="283.0" font-size="11.5" fill="#6f6840">If sub-workflow crashes or returns malformed data, builds graceful fallback using original</text>
<text x="72" y="297.0" font-size="11.5" fill="#6f6840">toolCallId.</text>
<text x="72" y="311.0" font-size="11.5" fill="#6f6840">VAPI always receives a valid { results: [{ toolCallId, result }] } response — never silence.</text>

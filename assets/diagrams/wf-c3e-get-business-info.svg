<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 -30 860 694" width="860" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
<rect x="-30" y="-30" width="860" height="694" fill="#f7f7f8"/>
<defs><pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#dcdce0"/></pattern></defs>
<rect x="-30" y="-30" width="860" height="694" fill="url(#g)"/>
<rect x="60" y="60" width="680" height="300" rx="8" fill="#cfe4ff" fill-opacity="0.55" stroke="#d8cf7a" stroke-opacity="0.6"/>
<text x="72" y="84" font-size="13.5" font-weight="700" fill="#5f5930">D3 — WF-C3e: Tool — get_business_info</text>
<text x="72" y="101" font-size="11.5" fill="#6f6840">Called by WF-C2 when Claude invokes the get_business_info tool.</text>
<text x="72" y="115" font-size="11.5" fill="#6f6840">Returns structured knowledge about Solarify: services, pricing, subsidies,</text>
<text x="72" y="129" font-size="11.5" fill="#6f6840">finance, warranties, service area, installation process, hours, contact.</text>
<text x="72" y="143" font-size="11.5" fill="#6f6840">Input (from WF-C2):</text>
<text x="72" y="157" font-size="11.5" fill="#6f6840">- toolUseId — Claude tool_use ID (must be echoed back as toolCallId)</text>
<text x="72" y="171" font-size="11.5" fill="#6f6840">- toolInput.topic — knowledge topic requested</text>
<text x="72" y="185" font-size="11.5" fill="#6f6840">Output:</text>
<text x="72" y="199" font-size="11.5" fill="#6f6840">- toolCallId — echoes toolUseId</text>
<text x="72" y="213" font-size="11.5" fill="#6f6840">- result — single-line string answer</text>
<text x="72" y="227" font-size="11.5" fill="#6f6840">No external API calls. No credentials needed.</text>
<text x="72" y="241" font-size="11.5" fill="#6f6840">All knowledge is embedded in the Code node.</text>
<text x="72" y="255" font-size="11.5" fill="#6f6840">Upgrade to Supabase RAG post-MVP by replacing the Code node.</text>
<g fill="none" stroke="#9aa0a6" stroke-width="2.5">
<path d="M180,490 C252,490 268,490 333,490"/>
<path d="M333,485 L340,490 L333,495" fill="#9aa0a6" stroke="none"/>
</g>
<rect x="80" y="440" width="100" height="100" rx="50" fill="#ffffff" stroke="#f0a30a" stroke-width="3"/>
<rect x="80" y="440" width="100" height="100" rx="50" fill="#f0a30a" fill-opacity="0.10"/>
<text x="130.0" y="486.0" font-size="11" text-anchor="middle" fill="#f0a30a" font-weight="700">sub-flow</text>
<text x="130.0" y="500.0" font-size="11" text-anchor="middle" fill="#f0a30a" font-weight="700">in</text>
<text x="130.0" y="555" font-size="11.5" text-anchor="middle" fill="#2b2f36">When Called by WF-C2</text>
<rect x="340" y="440" width="100" height="100" rx="10" fill="#ffffff" stroke="#f56b6b" stroke-width="3"/>

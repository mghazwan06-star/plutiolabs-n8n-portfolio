<text x="390.0" y="486.0" font-size="11" text-anchor="middle" fill="#f56b6b" font-weight="700">code</text>
<text x="390.0" y="555" font-size="11.5" text-anchor="middle" fill="#2b2f36">Lookup Business Info</text>

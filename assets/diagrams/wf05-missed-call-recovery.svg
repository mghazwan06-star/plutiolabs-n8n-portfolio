<text x="72" y="104.0" font-size="13.5" font-weight="700" fill="#5f5930">WF5 — Missed Call Recovery</text>
<text x="72" y="121.0" font-size="11.5" fill="#6f6840">Polls every 30 min. Finds leads that did not answer and works them through the</text>
<text x="72" y="135.0" font-size="11.5" fill="#6f6840">retry sequence.</text>
<text x="72" y="149.0" font-size="11.5" fill="#6f6840">Sequence logic:</text>
<text x="72" y="163.0" font-size="11.5" fill="#6f6840">- Step 0 + no-answer/voicemail: wait 30 min, then Call 2</text>
<text x="72" y="177.0" font-size="11.5" fill="#6f6840">- Step 1 + sequence-active: wait 4h, then SMS Follow-up</text>
<text x="72" y="191.0" font-size="11.5" fill="#6f6840">- Step 2 + sequence-active: wait 24h, then Call 3</text>
<text x="72" y="205.0" font-size="11.5" fill="#6f6840">- Step 3 + sequence-active: wait 2h grace, then Mark Unresponsive</text>
<text x="72" y="219.0" font-size="11.5" fill="#6f6840">Callback branch: Fires VAPI when Callback Time is reached.</text>
<text x="72" y="233.0" font-size="11.5" fill="#6f6840">Business hours: Calls and SMS only fire 08:00-20:59 London time.</text>
<text x="72" y="247.0" font-size="11.5" fill="#6f6840">Error alerts: Owner SMS alert if VAPI call fails to queue.</text>
<text x="72" y="261.0" font-size="11.5" fill="#6f6840">Activate AFTER WF3, WF4, WF2, WF1 are active.</text>

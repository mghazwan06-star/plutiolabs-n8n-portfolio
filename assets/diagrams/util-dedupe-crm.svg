<text x="-408" y="-19.0" font-size="11.5" fill="#6f6840">Keeps the first occurrence of each MCS Cert Number, deletes later</text>
<text x="-408" y="-5.0" font-size="11.5" fill="#6f6840">ones.</text>
<text x="-408" y="9.0" font-size="11.5" fill="#6f6840">Cause of the duplicates: F-R3 — the Sheets node wrote +44XXXXXXXXXX</text>
<text x="-408" y="23.0" font-size="11.5" fill="#6f6840">under USER_ENTERED, Google coerced it to the number 441224638888, s…</text>
<text x="-408" y="37.0" font-size="11.5" fill="#6f6840">Deletes bottom-up in merged contiguous ranges so row indices don&#x27;t</text>
<text x="-408" y="51.0" font-size="11.5" fill="#6f6840">shift mid-operation.</text>
<text x="-408" y="65.0" font-size="11.5" fill="#6f6840">Dry run by default. POST {&quot;apply&quot;: true} to actually delete.</text>

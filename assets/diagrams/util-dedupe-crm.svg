<text x="-408" y="-36" font-size="13.5" font-weight="700" fill="#5f5930">De-duplicates the Outreach CRM</text>
<text x="-408" y="-19" font-size="11.5" fill="#6f6840">Keeps the first occurrence of each MCS Cert Number, deletes later</text>
<text x="-408" y="-5" font-size="11.5" fill="#6f6840">ones.</text>
<text x="-408" y="9" font-size="11.5" fill="#6f6840">Cause of the duplicates: F-R3 — the Sheets node wrote +44XXXXXXXXXX</text>
<text x="-408" y="23" font-size="11.5" fill="#6f6840">under USER_ENTERED, Google coerced it to the number 441224638888, s…</text>
<text x="-408" y="37" font-size="11.5" fill="#6f6840">Deletes bottom-up in merged contiguous ranges so row indices don&#x27;t</text>
<text x="-408" y="51" font-size="11.5" fill="#6f6840">shift mid-operation.</text>
<text x="-408" y="65" font-size="11.5" fill="#6f6840">Dry run by default. POST {&quot;apply&quot;: true} to actually delete.</text>

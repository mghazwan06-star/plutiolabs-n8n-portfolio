<text x="-228" y="-296.0" font-size="13.5" font-weight="700" fill="#5f5930">WF8 — Inbound Lead Lookup</text>
<text x="-228" y="-279.0" font-size="11.5" fill="#6f6840">Called SYNCHRONOUSLY by WF-IN2 on every</text>
<text x="-228" y="-265.0" font-size="11.5" fill="#6f6840">assistant-request event.</text>
<text x="-228" y="-251.0" font-size="11.5" fill="#6f6840">Runs BEFORE the AI speaks — must complete in &lt; 3</text>
<text x="-228" y="-237.0" font-size="11.5" fill="#6f6840">seconds.</text>
<text x="-228" y="-223.0" font-size="11.5" fill="#6f6840">Flow:</text>
<text x="-228" y="-209.0" font-size="11.5" fill="#6f6840">1. Extract phone from VAPI assistant-request</text>
<text x="-228" y="-195.0" font-size="11.5" fill="#6f6840">payload</text>
<text x="-228" y="-181.0" font-size="11.5" fill="#6f6840">2. No phone (withheld number) → return empty</text>
<text x="-228" y="-167.0" font-size="11.5" fill="#6f6840">variables</text>
<text x="-228" y="-153.0" font-size="11.5" fill="#6f6840">3. Lookup phone in Clients tab</text>
<text x="-228" y="-139.0" font-size="11.5" fill="#6f6840">4. Return { variables: {...} } with callerName,</text>
<text x="-228" y="-125.0" font-size="11.5" fill="#6f6840">serviceInterest, isExistingLead, callCount,…</text>
<text x="-228" y="-111.0" font-size="11.5" fill="#6f6840">VAPI injects these into the AI system prompt</text>
<text x="-228" y="-97.0" font-size="11.5" fill="#6f6840">before first speech.</text>
<text x="-228" y="-83.0" font-size="11.5" fill="#6f6840">Upstream: WF-IN2 (sync call on assistant-request)</text>
<text x="-228" y="-69.0" font-size="11.5" fill="#6f6840">Downstream: Returns { variables: {...} } to WF-IN2</text>
<text x="-228" y="-55.0" font-size="11.5" fill="#6f6840">Sheets: Reads Clients. NEVER writes.</text>
<text x="-228" y="-41.0" font-size="11.5" fill="#6f6840">⚠️ Constraint: must complete in &lt; 3 seconds.</text>

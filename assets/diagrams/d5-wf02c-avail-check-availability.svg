<text x="72" y="104.0" font-size="13.5" font-weight="700" fill="#5f5930">D5-WF2c-avail — checkAvailability Tool Handler</text>
<text x="72" y="121.0" font-size="11.5" fill="#6f6840">Called synchronously by D5-WF2b when VAPI fires a checkAvailability tool call.</text>
<text x="72" y="135.0" font-size="11.5" fill="#6f6840">MUST respond within 5 seconds — VAPI timeout.</text>
<text x="72" y="149.0" font-size="11.5" fill="#6f6840">Input: { toolCallId, toolArgs: { date }, phone, campaignId, name }</text>
<text x="72" y="163.0" font-size="11.5" fill="#6f6840">Output: { results: [{ toolCallId, result: &#x27;availability string&#x27; }] }</text>
<text x="72" y="177.0" font-size="11.5" fill="#6f6840">Queries Google Calendar 09:00–17:00 BST. Returns up to 3 open slots as a single-line</text>
<text x="72" y="191.0" font-size="11.5" fill="#6f6840">string.</text>
<text x="72" y="205.0" font-size="11.5" fill="#6f6840">Error handling: Calendar API error → graceful fallback string (never fake</text>
<text x="72" y="219.0" font-size="11.5" fill="#6f6840">availability).</text>

<rect x="-20" y="60.0" width="1300" height="156" rx="8" fill="#fff8b8" fill-opacity="0.55" stroke="#d8cf7a" stroke-opacity="0.6"/>
<text x="-8" y="84.0" font-size="13.5" font-weight="700" fill="#5f5930">Apify Runner (shared sub-workflow)</text>
<text x="-8" y="101.0" font-size="11.5" fill="#6f6840">Called by the CHILD enrich workflow for BOTH the place lookup and the review scrape.</text>
<text x="-8" y="115.0" font-size="11.5" fill="#6f6840">Why it exists: Code nodes on this n8n version have no $helpers.httpRequest (bug F-R15), so every Apify call must go through an HTTP Request node. Rather than duplicate</text>
<text x="-8" y="129.0" font-size="11.5" fill="#6f6840">start/poll/fetch twice, both callers share this.</text>
<text x="-8" y="143.0" font-size="11.5" fill="#6f6840">Input: { actorInput: { ...Google Places actor input... } }</text>
<text x="-8" y="157.0" font-size="11.5" fill="#6f6840">Output: { status, runId, count, items: [ ...dataset rows... ] }</text>
<text x="-8" y="171.0" font-size="11.5" fill="#6f6840">Auth is the Apify API credential (httpHeaderAuth, locked to api.apify.com). The key is NOT in any workflow config.</text>
<text x="-8" y="185.0" font-size="11.5" fill="#6f6840">Poll loop: start with waitForFinish=60, then Wait 20s → status → repeat. Bounded by the workflow execution timeout (30 min).</text>
<g fill="none" stroke="#9aa0a6" stroke-width="2.5">

<svg xmlns="http://www.w3.org/2000/svg" viewBox="-64 16.0 1388 624.0" width="1388" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
<rect x="-64" y="16.0" width="1388" height="624.0" fill="#f7f7f8"/>

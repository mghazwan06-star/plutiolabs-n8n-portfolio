<svg xmlns="http://www.w3.org/2000/svg" viewBox="-110 -30 1480 754" width="1480" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
<rect x="-110" y="-30" width="1480" height="754" fill="#f7f7f8"/>
<defs><pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#dcdce0"/></pattern></defs>
<rect x="-110" y="-30" width="1480" height="754" fill="url(#g)"/>
<rect x="-20" y="60" width="1300" height="180" rx="8" fill="#fff8b8" fill-opacity="0.55" stroke="#d8cf7a" stroke-opacity="0.6"/>
<text x="-8" y="84" font-size="13.5" font-weight="700" fill="#5f5930">Apify Runner (shared sub-workflow)</text>
<text x="-8" y="101" font-size="11.5" fill="#6f6840">Called by the CHILD enrich workflow for BOTH the place lookup and the review scrape.</text>
<text x="-8" y="115" font-size="11.5" fill="#6f6840">Why it exists: Code nodes on this n8n version have no $helpers.httpRequest (bug F-R15), so every Apify call must go through an HTTP Request node. Rather than duplicate</text>
<text x="-8" y="129" font-size="11.5" fill="#6f6840">start/poll/fetch twice, both callers share this.</text>
<text x="-8" y="143" font-size="11.5" fill="#6f6840">Input: { actorInput: { ...Google Places actor input... } }</text>
<text x="-8" y="157" font-size="11.5" fill="#6f6840">Output: { status, runId, count, items: [ ...dataset rows... ] }</text>
<text x="-8" y="171" font-size="11.5" fill="#6f6840">Auth is the Apify API credential (httpHeaderAuth, locked to api.apify.com). The key is NOT in any workflow config.</text>
<text x="-8" y="185" font-size="11.5" fill="#6f6840">Poll loop: start with waitForFinish=60, then Wait 20s → status → repeat. Bounded by the workflow execution timeout (30 min).</text>
<g fill="none" stroke="#9aa0a6" stroke-width="2.5">

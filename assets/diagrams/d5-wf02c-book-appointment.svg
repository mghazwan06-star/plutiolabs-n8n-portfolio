<text x="72" y="104" font-size="13.5" font-weight="700" fill="#5f5930">D5-WF2c-book — bookAppointment Tool Handler</text>
<text x="72" y="121" font-size="11.5" fill="#6f6840">Called synchronously by D5-WF2b. Must respond within 5 seconds.</text>
<text x="72" y="135" font-size="11.5" fill="#6f6840">Writes: Appointment Log (Booked By=d5-reactivation) | Clients (Status=booked, Last</text>
<text x="72" y="149" font-size="11.5" fill="#6f6840">Channel=voice) | Reactivation Log (status=booked)</text>
<text x="72" y="163" font-size="11.5" fill="#6f6840">Composite key rule: Reactivation Log always matched on [Phone + Campaign ID].</text>
<text x="72" y="177" font-size="11.5" fill="#6f6840">Duplicate guard: Reads Appointment Log for Phone+Status=confirmed before booking —</text>
<text x="72" y="191" font-size="11.5" fill="#6f6840">blocks cross-channel duplicates (catches D2 and D3 bookings too).</text>
<text x="72" y="205" font-size="11.5" fill="#6f6840">Input: { toolCallId, toolArgs: { date, time, service, address }, phone, campaignId,</text>
<text x="72" y="219" font-size="11.5" fill="#6f6840">name }</text>
<text x="72" y="233" font-size="11.5" fill="#6f6840">Output: { results: [{ toolCallId, result }] }</text>

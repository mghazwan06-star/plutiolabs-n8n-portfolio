<text x="-188" y="-56.0" font-size="13.5" font-weight="700" fill="#5f5930">D5-WF2: Voice Reactivation Engine</text>
<text x="-188" y="-39.0" font-size="11.5" fill="#6f6840">Scheduled every 30 min (Mon–Sat 09:00–17:00 GMT/BST).</text>
<text x="-188" y="-25.0" font-size="11.5" fill="#6f6840">Reads Reactivation Log for idle leads (queued +</text>
<text x="-188" y="-11.0" font-size="11.5" fill="#6f6840">retry-pending + stale call-initiated 2h).</text>
<text x="-188" y="3.0" font-size="11.5" fill="#6f6840">Cross-checks Clients.Status before firing each call (skips</text>
<text x="-188" y="17.0" font-size="11.5" fill="#6f6840">booked/DNC/not-interested).</text>
<text x="-188" y="31.0" font-size="11.5" fill="#6f6840">Fires VAPI outbound calls with D5’s own assistant.</text>
<text x="-188" y="45.0" font-size="11.5" fill="#6f6840">Upstream: D5-WF1 writes leads to Reactivation Log.</text>
<text x="-188" y="59.0" font-size="11.5" fill="#6f6840">Downstream: D5-WF2b routes VAPI events (ID:</text>
<text x="-188" y="73.0" font-size="11.5" fill="#6f6840">1EsyoHL1IaXcyON5, webhook: /webhook/d5-vapi-events).</text>
<text x="-188" y="87.0" font-size="11.5" fill="#6f6840">All PLACEHOLDER values must be filled before activation.</text>

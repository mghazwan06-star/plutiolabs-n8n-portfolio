<text x="-8" y="64.0" font-size="13.5" font-weight="700" fill="#5f5930">Route Recompute (free lead-quality upgrade)</text>
<text x="-8" y="81.0" font-size="11.5" fill="#6f6840">POST /webhook/route-recompute - dry run, reports what would change, writes nothing</text>
<text x="-8" y="95.0" font-size="11.5" fill="#6f6840">POST /webhook/route-recompute {&quot;apply&quot;:true} - commits</text>
<text x="-8" y="109.0" font-size="11.5" fill="#6f6840">Why it exists: Template Route is derived ONLY from columns already in the sheet (Priority,</text>
<text x="-8" y="123.0" font-size="11.5" fill="#6f6840">Competitor Reviews, Review Count, Top Complaint, Best Review Quote). So when the routing RULE</text>
<text x="-8" y="137.0" font-size="11.5" fill="#6f6840">changes - as it did with Lever 3 (P2 + gap=30 qualifies for A-lite) and Lever 4 (wider complaint</text>
<text x="-8" y="151.0" font-size="11.5" fill="#6f6840">keywords) - existing rows can be upgraded with no Apify and no Claude spend.</text>
<text x="-8" y="165.0" font-size="11.5" fill="#6f6840">Safety: writes ONLY the two adjacent route columns (T:U), so it cannot touch the Claude fields</text>
<text x="-8" y="179.0" font-size="11.5" fill="#6f6840">and is immune to HAZARD-1. Aborts if those two columns are ever not adjacent.</text>
<text x="-8" y="193.0" font-size="11.5" fill="#6f6840">Keep the rule in this node in lockstep with computeTemplateRoute() in the CHILD&#x27;s Build CRM Row.</text>
<g fill="none" stroke="#9aa0a6" stroke-width="2.5">

<rect x="60" y="60" width="680" height="300" rx="8" fill="#cfe4ff" fill-opacity="0.55" stroke="#d8cf7a" stroke-opacity="0.6"/>
<text x="72" y="84" font-size="13.5" font-weight="700" fill="#5f5930">D3 — WF-C4: Send Reply</text>
<text x="72" y="101" font-size="11.5" fill="#6f6840">Called by WF-C2 after Claude produces a final text response.</text>
<text x="72" y="115" font-size="11.5" fill="#6f6840">Sends the reply to the customer via Twilio WhatsApp API.</text>
<text x="72" y="129" font-size="11.5" fill="#6f6840">Input (from WF-C2 via Execute Workflow):</text>
<text x="72" y="143" font-size="11.5" fill="#6f6840">- phone — customer E.164 number (+447700…)</text>
<text x="72" y="157" font-size="11.5" fill="#6f6840">- message — reply text from Claude</text>
<text x="72" y="171" font-size="11.5" fill="#6f6840">Credentials needed before activation:</text>
<text x="72" y="185" font-size="11.5" fill="#6f6840">- Twilio HTTP Basic Auth (Account SID as username, Auth Token as password)</text>
<text x="72" y="199" font-size="11.5" fill="#6f6840">Set on the &#x27;Send WhatsApp via Twilio&#x27; node.</text>
<text x="72" y="213" font-size="11.5" fill="#6f6840">Config placeholders to fill in ⚙️ Client Config:</text>
<text x="72" y="227" font-size="11.5" fill="#6f6840">- twilioMessagesUrl — full URL:</text>
<text x="72" y="241" font-size="11.5" fill="#6f6840">https://api.twilio.com/2010-04-01/Accounts/ACxxxxx/Messages.json</text>
<text x="72" y="255" font-size="11.5" fill="#6f6840">- twilioFromNumber — your WhatsApp-enabled Twilio number as: whatsapp:+447xxxxxxxx</text>
<g fill="none" stroke="#9aa0a6" stroke-width="2.5">

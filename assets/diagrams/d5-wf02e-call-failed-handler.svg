<text x="72" y="104" font-size="13.5" font-weight="700" fill="#5f5930">D5-WF2e — Call-Failed Handler</text>
<text x="72" y="121" font-size="11.5" fill="#6f6840">Called asynchronously by D5-WF2b on VAPI call-failed events. No VAPI</text>
<text x="72" y="135" font-size="11.5" fill="#6f6840">response needed.</text>
<text x="72" y="149" font-size="11.5" fill="#6f6840">Job: Log call-failed to Reactivation Log + alert owner.</text>
<text x="72" y="163" font-size="11.5" fill="#6f6840">Does NOT retry — WF2 handles retry at next scheduled run (30 min</text>
<text x="72" y="177" font-size="11.5" fill="#6f6840">interval).</text>
<text x="72" y="191" font-size="11.5" fill="#6f6840">Input: raw VAPI call-failed webhook body</text>
<text x="72" y="205" font-size="11.5" fill="#6f6840">CRM write: Reactivation Status=call-failed, Error Notes, Last Touch</text>

<text x="72" y="84.0" font-size="13.5" font-weight="700" fill="#5f5930">D3 — WF-C3f: Tool — handle_dnc</text>
<text x="72" y="101.0" font-size="11.5" fill="#6f6840">Called when customer explicitly opts out of all contact.</text>
<text x="72" y="115.0" font-size="11.5" fill="#6f6840">Sets Status=do-not-contact and SMS Opt-Out=Y in Clients tab.</text>
<text x="72" y="129.0" font-size="11.5" fill="#6f6840">CRM writes (Clients tab):</text>
<text x="72" y="143.0" font-size="11.5" fill="#6f6840">- Status = do-not-contact</text>
<text x="72" y="157.0" font-size="11.5" fill="#6f6840">- SMS Opt-Out = Y</text>
<text x="72" y="171.0" font-size="11.5" fill="#6f6840">- Last Outcome = do-not-contact</text>
<text x="72" y="185.0" font-size="11.5" fill="#6f6840">- Last Channel = chatbot</text>
<text x="72" y="199.0" font-size="11.5" fill="#6f6840">- Last Contact = now</text>
<text x="72" y="213.0" font-size="11.5" fill="#6f6840">Matched by Phone. Pattern from D5 Update Clients - DNC.</text>
<text x="72" y="227.0" font-size="11.5" fill="#6f6840">Last Channel=chatbot (D3 pattern vs voice in D2/D5).</text>
<text x="72" y="241.0" font-size="11.5" fill="#6f6840">UK GDPR / PECR compliance node — must not be bypassed.</text>

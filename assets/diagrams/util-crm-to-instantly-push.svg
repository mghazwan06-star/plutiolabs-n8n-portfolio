<rect x="-20" y="20.0" width="1320" height="231" rx="8" fill="#fff8b8" fill-opacity="0.55" stroke="#d8cf7a" stroke-opacity="0.6"/>
<text x="-8" y="44.0" font-size="13.5" font-weight="700" fill="#5f5930">CRM - Instantly Push (batch sending)</text>
<text x="-8" y="61.0" font-size="11.5" fill="#6f6840">Replaces the manual CSV export/import in the playbook with a direct API push.</text>
<text x="-8" y="75.0" font-size="11.5" fill="#6f6840">Dry run (safe, default):</text>
<text x="-8" y="89.0" font-size="11.5" fill="#6f6840">POST /webhook/instantly-push {&quot;route&quot;:&quot;A-lite&quot;,&quot;limit&quot;:250}</text>
<text x="-8" y="103.0" font-size="11.5" fill="#6f6840">Commit:</text>
<text x="-8" y="117.0" font-size="11.5" fill="#6f6840">POST /webhook/instantly-push {&quot;campaignId&quot;:&quot;&lt;uuid&quot;,&quot;route&quot;:&quot;A-lite&quot;,&quot;limit&quot;:250,&quot;apply&quot;:true}</text>
<text x="-8" y="131.0" font-size="11.5" fill="#6f6840">Batch-by-batch safety, three layers:</text>
<text x="-8" y="145.0" font-size="11.5" fill="#6f6840">1. Only picks rows with Status = new, then marks them queued - so batch 2 never overlaps batch 1</text>
<text x="-8" y="159.0" font-size="11.5" fill="#6f6840">2. skip_if_in_campaign + skip_if_in_workspace - Instantly dedupes server-side as well</text>
<text x="-8" y="173.0" font-size="11.5" fill="#6f6840">3. Nothing is pushed and nothing is written without BOTH apply:true AND a campaignId</text>
<text x="-8" y="187.0" font-size="11.5" fill="#6f6840">verify_leads_on_import: true - Instantly verifies on import, which may remove the need for ZeroBounce entirely.</text>
<text x="-8" y="201.0" font-size="11.5" fill="#6f6840">namedOnly: true (default) restricts to contacts whose email is a real person rather than an info@ role inbox.</text>
<text x="-8" y="215.0" font-size="11.5" fill="#6f6840">Custom variable keys match the CRM headers EXACTLY (spaces and case), per the playbook&#x27;s field map.</text>

<text x="-448" y="-96.0" font-size="13.5" font-weight="700" fill="#5f5930">v4 PARENT — Batch Orchestrator</text>
<text x="-448" y="-79.0" font-size="11.5" fill="#6f6840">Solves two constraints that pull against each other:</text>
<text x="-448" y="-65.0" font-size="11.5" fill="#6f6840">Memory (F-R1). n8n keeps every node&#x27;s input AND output. A ~20-node chain over</text>
<text x="-448" y="-51.0" font-size="11.5" fill="#6f6840">5,603 items = ~20 copies resident → the instance was killed at 47s. The child is…</text>
<text x="-448" y="-37.0" font-size="11.5" fill="#6f6840">Competitor pool (F-R2). A 500-lead slice matches at 48.6%; the full pool at</text>
<text x="-448" y="-23.0" font-size="11.5" fill="#6f6840">~100%. So the parent builds ONE global index and passes it to every batch —…</text>
<text x="-448" y="-9.0" font-size="11.5" fill="#6f6840">Flow</text>
<text x="-448" y="5.0" font-size="11.5" fill="#6f6840">fetch → filter → reconcile → build index → loop batches → child → counts back</text>
<text x="-448" y="19.0" font-size="11.5" fill="#6f6840">The child (dpgZ964TabmgSJ0k) returns counts only. Returning records would put the</text>
<text x="-448" y="33.0" font-size="11.5" fill="#6f6840">dataset back in the parent&#x27;s memory and undo the whole point.</text>
<text x="-448" y="47.0" font-size="11.5" fill="#6f6840">This workflow owns the config. The child reads config from the payload, so there</text>
<text x="-448" y="61.0" font-size="11.5" fill="#6f6840">is no drift.</text>

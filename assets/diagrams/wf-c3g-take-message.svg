<text x="72" y="84.0" font-size="13.5" font-weight="700" fill="#5f5930">WF-C3g — Tool: take_message</text>
<text x="72" y="101.0" font-size="11.5" fill="#6f6840">Called by WF-C2 when the customer needs a human: complaint, technical fault,</text>
<text x="72" y="115.0" font-size="11.5" fill="#6f6840">commercial enquiry, recruitment, or an explicit request to speak to someone.</text>
<text x="72" y="129.0" font-size="11.5" fill="#6f6840">Writes: Messages tab (A:F) — Name, Phone, Message, Urgency, Timestamp,</text>
<text x="72" y="143.0" font-size="11.5" fill="#6f6840">Status=new.</text>
<text x="72" y="157.0" font-size="11.5" fill="#6f6840">Closes the 1 documented chatbot complaint — 89% of customers want a human option;</text>
<text x="72" y="171.0" font-size="11.5" fill="#6f6840">only 15% get a working handoff. Before this tool, D3 read out a phone number and…</text>
<text x="72" y="185.0" font-size="11.5" fill="#6f6840">Standards applied: ES5 + try/catch on all Code nodes, cellFormat: RAW (BUG-R17 —</text>
<text x="72" y="199.0" font-size="11.5" fill="#6f6840">Sheets coerces a leading +), populated schema on append (BUG-R5), and the…</text>
<text x="72" y="213.0" font-size="11.5" fill="#6f6840">⚠️ Operational dependency: someone must actually read the Messages tab.</text>

<rect x="-224" y="-560" width="420" height="520" rx="8" fill="#d9f2f2" fill-opacity="0.55" stroke="#d8cf7a" stroke-opacity="0.6"/>
<text x="-212" y="-536" font-size="13.5" font-weight="700" fill="#5f5930">WF7 — Appointment Reminders</text>
<text x="-212" y="-519" font-size="11.5" fill="#6f6840">Runs every 30 minutes. Reads Appointment Log + Clients.</text>
<text x="-212" y="-505" font-size="11.5" fill="#6f6840">Sends SMS reminders to clients with upcoming</text>
<text x="-212" y="-491" font-size="11.5" fill="#6f6840">appointments.</text>
<text x="-212" y="-477" font-size="11.5" fill="#6f6840">Reminder sequence:</text>
<text x="-212" y="-463" font-size="11.5" fill="#6f6840">- R1: 24h before (22–26h window) — day-before reminder</text>
<text x="-212" y="-449" font-size="11.5" fill="#6f6840">- R2: 2h before (1–3h window) — same-day reminder</text>
<text x="-212" y="-435" font-size="11.5" fill="#6f6840">Duplicate protection: Reminder1Sent / Reminder2Sent</text>
<text x="-212" y="-421" font-size="11.5" fill="#6f6840">stamps</text>
<text x="-212" y="-407" font-size="11.5" fill="#6f6840">SMS opt-out: Cross-referenced from Clients tab</text>
<text x="-212" y="-393" font-size="11.5" fill="#6f6840">Failure isolation: Split in Batches(1) — one failed SMS</text>
<text x="-212" y="-379" font-size="11.5" fill="#6f6840">never kills others</text>
<text x="-212" y="-365" font-size="11.5" fill="#6f6840">Error alert: Failed sends notify owner via SMS</text>
<text x="-212" y="-351" font-size="11.5" fill="#6f6840">New Appointment Log columns required:</text>
<text x="-212" y="-337" font-size="11.5" fill="#6f6840">AppointmentTimeISO | Reminder1Sent | Reminder2Sent |</text>
<text x="-212" y="-323" font-size="11.5" fill="#6f6840">ConfirmedAt | CancelledAt</text>
<text x="-212" y="-309" font-size="11.5" fill="#6f6840">CONFIRM/CANCEL replies: Handled by WF6 (new intent</text>
<text x="-212" y="-295" font-size="11.5" fill="#6f6840">branches)</text>
<text x="-212" y="-281" font-size="11.5" fill="#6f6840">Credentials: Google Sheets OAuth2 + Twilio</text>
<rect x="560" y="-560" width="380" height="420" rx="8" fill="#cfe4ff" fill-opacity="0.55" stroke="#d8cf7a" stroke-opacity="0.6"/>
<text x="572" y="-536" font-size="13.5" font-weight="700" fill="#5f5930">Reminder Window Logic</text>
<text x="572" y="-519" font-size="11.5" fill="#6f6840">R1 (24h): diffH = 22 &amp;&amp; diffH &lt;= 26</text>
<text x="572" y="-505" font-size="11.5" fill="#6f6840">→ 4h window catches any 30-min cron run near the</text>
<text x="572" y="-491" font-size="11.5" fill="#6f6840">24h mark</text>
<text x="572" y="-477" font-size="11.5" fill="#6f6840">R2 (2h): diffH = 1 &amp;&amp; diffH &lt;= 3</text>
<text x="572" y="-463" font-size="11.5" fill="#6f6840">→ 2h window catches any cron run near the 2h mark</text>
<text x="572" y="-449" font-size="11.5" fill="#6f6840">Skip conditions:</text>
<text x="572" y="-435" font-size="11.5" fill="#6f6840">- Appointment Log Status !== &#x27;confirmed&#x27;</text>
<text x="572" y="-421" font-size="11.5" fill="#6f6840">- CancelledAt is set (client cancelled via SMS)</text>
<text x="572" y="-407" font-size="11.5" fill="#6f6840">- Clients.SMS Opt-Out === &#x27;Y&#x27;</text>
<text x="572" y="-393" font-size="11.5" fill="#6f6840">- AppointmentTimeISO missing or unparseable</text>
<text x="572" y="-379" font-size="11.5" fill="#6f6840">- Appointment already in the past (diffH &lt; 0)</text>
<text x="572" y="-365" font-size="11.5" fill="#6f6840">- Reminder already sent (Reminder1Sent /</text>
<text x="572" y="-351" font-size="11.5" fill="#6f6840">Reminder2Sent not empty)</text>
<text x="572" y="-337" font-size="11.5" fill="#6f6840">Error handling: Failed Twilio sends alert owner</text>
<text x="572" y="-323" font-size="11.5" fill="#6f6840">via SMS</text>

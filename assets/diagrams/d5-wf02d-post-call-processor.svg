<rect x="60" y="80" width="760" height="300" rx="8" fill="#cfe4ff" fill-opacity="0.55" stroke="#d8cf7a" stroke-opacity="0.6"/>
<text x="72" y="104" font-size="13.5" font-weight="700" fill="#5f5930">D5-WF2d — Post-Call Processor (End-of-Call Handler)</text>
<text x="72" y="121" font-size="11.5" fill="#6f6840">Called asynchronously by D5-WF2b after VAPI fires end-of-call-report. No VAPI response needed.</text>
<text x="72" y="135" font-size="11.5" fill="#6f6840">Outcome routing:</text>
<text x="72" y="149" font-size="11.5" fill="#6f6840">- interested-callback → Reactivation Log (interested-callback) + D5 Callback Queue + Alert owner</text>
<text x="72" y="163" font-size="11.5" fill="#6f6840">- not-interested → Reactivation Log (declined-final)</text>
<text x="72" y="177" font-size="11.5" fill="#6f6840">- strong-dnc → Reactivation Log (opted-out) + Clients (do-not-contact, SMS Opt-Out=Y, Upcoming</text>
<text x="72" y="191" font-size="11.5" fill="#6f6840">Appointment cleared) + Alert owner</text>
<text x="72" y="205" font-size="11.5" fill="#6f6840">- no-answer → Retry logic (retry-pending if currentAttemptCount &lt; maxAttempts, else exhausted)</text>
<text x="72" y="219" font-size="11.5" fill="#6f6840">- already-terminal (booked/opted-out/interested-callback/declined-final/exhausted/completed) →</text>
<text x="72" y="233" font-size="11.5" fill="#6f6840">update transcript URL only</text>
<text x="72" y="247" font-size="11.5" fill="#6f6840">- unknown → log error</text>
<text x="72" y="261" font-size="11.5" fill="#6f6840">Attempt Count ownership: WF2 is the sole incrementer. WF2d never writes Attempt Count.</text>
<rect x="1460" y="80" width="400" height="200" rx="8" fill="#e8d9ff" fill-opacity="0.55" stroke="#d8cf7a" stroke-opacity="0.6"/>
<text x="1472" y="104" font-size="13.5" font-weight="700" fill="#5f5930">Outcome Branch Notes</text>
<text x="1472" y="121" font-size="11.5" fill="#6f6840">DNC write rule: Only strong-dnc propagates to</text>
<text x="1472" y="135" font-size="11.5" fill="#6f6840">Clients. not-interested stays in D5 only.</text>
<text x="1472" y="149" font-size="11.5" fill="#6f6840">Retry rule: condition is currentAttemptCount &lt;</text>
<text x="1472" y="163" font-size="11.5" fill="#6f6840">maxAttempts (WF2 already set count=1 after first…</text>
<text x="1472" y="177" font-size="11.5" fill="#6f6840">Composite key: Reactivation Log always matched on</text>
<text x="1472" y="191" font-size="11.5" fill="#6f6840">[Phone + Campaign ID].</text>

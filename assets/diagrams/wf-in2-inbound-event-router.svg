<rect x="-320" y="-416" width="380" height="440" rx="8" fill="#d9f2f2" fill-opacity="0.55" stroke="#d8cf7a" stroke-opacity="0.6"/>
<text x="-308" y="-392" font-size="13.5" font-weight="700" fill="#5f5930">WF-IN2 — Inbound VAPI Event Router</text>
<text x="-308" y="-375" font-size="11.5" fill="#6f6840">Single webhook URL for ALL inbound VAPI events.</text>
<text x="-308" y="-361" font-size="11.5" fill="#6f6840">Mirrors WF2 but adds assistant-request routing and</text>
<text x="-308" y="-347" font-size="11.5" fill="#6f6840">calls WF8.</text>
<text x="-308" y="-333" font-size="11.5" fill="#6f6840">Routing:</text>
<text x="-308" y="-319" font-size="11.5" fill="#6f6840">- assistant-request → WF8 Lead Lookup (sync, &lt; 3s)</text>
<text x="-308" y="-305" font-size="11.5" fill="#6f6840">→ return { variables: {...} }</text>
<text x="-308" y="-291" font-size="11.5" fill="#6f6840">- tool-calls → WF3 Tool Dispatcher (sync, &lt; 5s) →</text>
<text x="-308" y="-277" font-size="11.5" fill="#6f6840">return { results: [...] }</text>
<text x="-308" y="-263" font-size="11.5" fill="#6f6840">- end-of-call-report → WF-IN4 Post-Call (async,</text>
<text x="-308" y="-249" font-size="11.5" fill="#6f6840">fire+forget) → 200 OK</text>
<text x="-308" y="-235" font-size="11.5" fill="#6f6840">- Everything else → 200 OK, ignored</text>
<text x="-308" y="-221" font-size="11.5" fill="#6f6840">Setup:</text>
<text x="-308" y="-207" font-size="11.5" fill="#6f6840">1. Activate this workflow</text>
<text x="-308" y="-193" font-size="11.5" fill="#6f6840">2. Copy Production webhook URL from the Webhook</text>
<text x="-308" y="-179" font-size="11.5" fill="#6f6840">node</text>
<text x="-308" y="-165" font-size="11.5" fill="#6f6840">3. Paste into VAPI inbound assistant → Server URL</text>
<text x="-308" y="-151" font-size="11.5" fill="#6f6840">Upstream: VAPI (all inbound assistant events)</text>
<text x="-308" y="-137" font-size="11.5" fill="#6f6840">Downstream: WF8 (assistant-request), WF3</text>
<text x="-308" y="-123" font-size="11.5" fill="#6f6840">(tool-calls), WF-IN4 (end-of-call)</text>
<rect x="720" y="-288" width="300" height="220" rx="8" fill="#cfe4ff" fill-opacity="0.55" stroke="#d8cf7a" stroke-opacity="0.6"/>
<text x="732" y="-264" font-size="13.5" font-weight="700" fill="#5f5930">Tool-Calls Branch</text>
<text x="732" y="-247" font-size="11.5" fill="#6f6840">VAPI needs response within 5 seconds.</text>
<text x="732" y="-233" font-size="11.5" fill="#6f6840">Calls WF3 synchronously, waits for</text>
<text x="732" y="-219" font-size="11.5" fill="#6f6840">completion.</text>
<text x="732" y="-205" font-size="11.5" fill="#6f6840">Returns { results: [...] } directly to</text>
<text x="732" y="-191" font-size="11.5" fill="#6f6840">VAPI.</text>
<text x="732" y="-177" font-size="11.5" fill="#6f6840">Error handling: If WF3 crashes, Handle</text>
<text x="732" y="-163" font-size="11.5" fill="#6f6840">WF3 Response builds a graceful fallbac…</text>
<rect x="720" y="-528" width="300" height="220" rx="8" fill="#d4f0d4" fill-opacity="0.55" stroke="#d8cf7a" stroke-opacity="0.6"/>
<text x="732" y="-504" font-size="13.5" font-weight="700" fill="#5f5930">Assistant-Request Branch</text>
<text x="732" y="-487" font-size="11.5" fill="#6f6840">Fires BEFORE the AI speaks on every</text>
<text x="732" y="-473" font-size="11.5" fill="#6f6840">inbound call.</text>
<text x="732" y="-459" font-size="11.5" fill="#6f6840">Calls WF8 synchronously (must complete</text>
<text x="732" y="-445" font-size="11.5" fill="#6f6840">&lt; 3 seconds).</text>
<text x="732" y="-431" font-size="11.5" fill="#6f6840">WF8 looks up caller in Sheets and</text>
<text x="732" y="-417" font-size="11.5" fill="#6f6840">returns:</text>
<text x="732" y="-403" font-size="11.5" fill="#6f6840">{ variables: { callerName,</text>
<text x="732" y="-389" font-size="11.5" fill="#6f6840">serviceInterest, isExistingLead, ... }…</text>
<text x="732" y="-375" font-size="11.5" fill="#6f6840">VAPI injects these into the system</text>
<text x="732" y="-361" font-size="11.5" fill="#6f6840">prompt for personalized greeting.</text>
<text x="732" y="-347" font-size="11.5" fill="#6f6840">Fallback: If WF8 fails, returns empty</text>
<text x="732" y="-333" font-size="11.5" fill="#6f6840">variables — call proceeds with generic…</text>
<rect x="1440" y="-80" width="300" height="220" rx="8" fill="#e8d9ff" fill-opacity="0.55" stroke="#d8cf7a" stroke-opacity="0.6"/>
<text x="1452" y="-56" font-size="13.5" font-weight="700" fill="#5f5930">End-of-Call Branch</text>
<text x="1452" y="-39" font-size="11.5" fill="#6f6840">Fires WF-IN4 asynchronously — does NOT</text>
<text x="1452" y="-25" font-size="11.5" fill="#6f6840">wait.</text>
<text x="1452" y="-11" font-size="11.5" fill="#6f6840">Responds 200 OK to VAPI immediately.</text>
<text x="1452" y="3" font-size="11.5" fill="#6f6840">WF-IN4 handles: CRM update, Clients tab</text>
<text x="1452" y="17" font-size="11.5" fill="#6f6840">update,</text>
<text x="1452" y="31" font-size="11.5" fill="#6f6840">SMS confirmation, urgency alerts.</text>
<text x="1452" y="45" font-size="11.5" fill="#6f6840">Inbound calls only. Outbound calls use</text>
<text x="1452" y="59" font-size="11.5" fill="#6f6840">WF4 via WF2.</text>

<rect x="-320" y="-400.0" width="380" height="276" rx="8" fill="#d9f2f2" fill-opacity="0.55" stroke="#d8cf7a" stroke-opacity="0.6"/>
<text x="-308" y="-376.0" font-size="13.5" font-weight="700" fill="#5f5930">WF2 — VAPI Event Router</text>
<text x="-308" y="-359.0" font-size="11.5" fill="#6f6840">Single webhook URL given to VAPI. Receives ALL</text>
<text x="-308" y="-345.0" font-size="11.5" fill="#6f6840">events and routes them.</text>
<text x="-308" y="-331.0" font-size="11.5" fill="#6f6840">Routing:</text>
<text x="-308" y="-317.0" font-size="11.5" fill="#6f6840">- tool-calls → WF3 Tool Dispatcher (synchronous —</text>
<text x="-308" y="-303.0" font-size="11.5" fill="#6f6840">waits for response)</text>
<text x="-308" y="-289.0" font-size="11.5" fill="#6f6840">- end-of-call-report → WF4 Post-Call Processor</text>
<text x="-308" y="-275.0" font-size="11.5" fill="#6f6840">(async — fire and forget)</text>
<text x="-308" y="-261.0" font-size="11.5" fill="#6f6840">- Everything else → 200 OK, ignored</text>
<text x="-308" y="-247.0" font-size="11.5" fill="#6f6840">Setup:</text>
<text x="-308" y="-233.0" font-size="11.5" fill="#6f6840">1. Activate this workflow</text>
<text x="-308" y="-219.0" font-size="11.5" fill="#6f6840">2. Copy the Production webhook URL from the</text>
<text x="-308" y="-205.0" font-size="11.5" fill="#6f6840">Webhook node</text>
<text x="-308" y="-191.0" font-size="11.5" fill="#6f6840">3. Paste it into VAPI assistant → Server URL</text>
<text x="-308" y="-177.0" font-size="11.5" fill="#6f6840">Upstream: VAPI (all events)</text>
<text x="-308" y="-163.0" font-size="11.5" fill="#6f6840">Downstream: WF3 (tool calls), WF4 (post-call)</text>
<rect x="720" y="-336.0" width="300" height="171" rx="8" fill="#cfe4ff" fill-opacity="0.55" stroke="#d8cf7a" stroke-opacity="0.6"/>
<text x="732" y="-312.0" font-size="13.5" font-weight="700" fill="#5f5930">Tool-Calls Branch</text>
<text x="732" y="-295.0" font-size="11.5" fill="#6f6840">VAPI needs a response within 5 seconds.</text>
<text x="732" y="-281.0" font-size="11.5" fill="#6f6840">Calls WF3 synchronously, waits for</text>
<text x="732" y="-267.0" font-size="11.5" fill="#6f6840">completion,</text>
<text x="732" y="-253.0" font-size="11.5" fill="#6f6840">then returns { results: [...] }</text>
<text x="732" y="-239.0" font-size="11.5" fill="#6f6840">directly to VAPI.</text>
<text x="732" y="-225.0" font-size="11.5" fill="#6f6840">WF3 handles all 7 tools internally.</text>
<text x="732" y="-211.0" font-size="11.5" fill="#6f6840">Error Handling: If WF3 crashes, Handle</text>
<text x="732" y="-197.0" font-size="11.5" fill="#6f6840">WF3 Response builds a graceful fallbac…</text>
<rect x="1376" y="108.0" width="300" height="171" rx="8" fill="#e8d9ff" fill-opacity="0.55" stroke="#d8cf7a" stroke-opacity="0.6"/>
<text x="1388" y="132.0" font-size="13.5" font-weight="700" fill="#5f5930">End-of-Call Branch</text>
<text x="1388" y="149.0" font-size="11.5" fill="#6f6840">Fires WF4 asynchronously — does NOT</text>
<text x="1388" y="163.0" font-size="11.5" fill="#6f6840">wait.</text>
<text x="1388" y="177.0" font-size="11.5" fill="#6f6840">Responds 200 OK to VAPI immediately.</text>
<text x="1388" y="191.0" font-size="11.5" fill="#6f6840">WF4 handles: CRM update, Clients tab</text>
<text x="1388" y="205.0" font-size="11.5" fill="#6f6840">update,</text>
<text x="1388" y="219.0" font-size="11.5" fill="#6f6840">SMS confirmation, urgency alerts.</text>
<text x="1388" y="233.0" font-size="11.5" fill="#6f6840">⚠️ Update wf4Id in Client Config when</text>
<text x="1388" y="247.0" font-size="11.5" fill="#6f6840">WF4 is built.</text>

<text x="292" y="64" font-size="13.5" font-weight="700" fill="#5f5930">WF-C3b: Book House Visit</text>
<text x="292" y="81" font-size="11.5" fill="#6f6840">Called by: WF-C2 (Claude Core) via Execute Workflow node</text>
<text x="292" y="95" font-size="11.5" fill="#6f6840">Input: { toolInput: { date, time, service, address, name, email }, toolUseId, phone }</text>
<text x="292" y="109" font-size="11.5" fill="#6f6840">Output: { toolCallId, result }</text>
<text x="292" y="123" font-size="11.5" fill="#6f6840">1. Compute ISO start/end times (BST-aware)</text>
<text x="292" y="137" font-size="11.5" fill="#6f6840">2. Read Appointment Log → check for existing confirmed booking</text>
<text x="292" y="151" font-size="11.5" fill="#6f6840">3. Read Clients → detect new lead</text>
<text x="292" y="165" font-size="11.5" fill="#6f6840">4. IF duplicate → return already-booked message</text>
<text x="292" y="179" font-size="11.5" fill="#6f6840">5. Create Google Calendar event</text>
<text x="292" y="193" font-size="11.5" fill="#6f6840">6. Append to Appointment Log (all columns incl. CalendarEventId)</text>
<text x="292" y="207" font-size="11.5" fill="#6f6840">7. Update Clients core fields (always)</text>
<text x="292" y="221" font-size="11.5" fill="#6f6840">8. IF new lead → write first-touch fields (Lead Source, Created At, SMS Opt-Out, Sequence Step)</text>
<text x="292" y="235" font-size="11.5" fill="#6f6840">9. Return success message</text>
<g fill="none" stroke="#9aa0a6" stroke-width="2.5">

<text x="292" y="64" font-size="13.5" font-weight="700" fill="#5f5930">WF-C1: WhatsApp Receiver — Twilio Inbound Gateway</text>
<text x="292" y="81" font-size="11.5" fill="#6f6840">Receives inbound WhatsApp messages from Twilio, responds 200 immediately (onReceived), then async-fires message to WF-C2</text>
<text x="292" y="95" font-size="11.5" fill="#6f6840">(Claude Core).</text>
<text x="292" y="109" font-size="11.5" fill="#6f6840">Twilio POST body fields:</text>
<text x="292" y="123" font-size="11.5" fill="#6f6840">- From: &quot;whatsapp:+44XXXXXXXXXX&quot; → stripped to &quot;+44XXXXXXXXXX&quot; (E.164)</text>
<text x="292" y="137" font-size="11.5" fill="#6f6840">- Body: raw message text</text>
<text x="292" y="151" font-size="11.5" fill="#6f6840">- To: business WhatsApp number</text>
<text x="292" y="165" font-size="11.5" fill="#6f6840">Flow: Twilio POST → Webhook (200 immediately) → ⚙️ Config → Normalize Phone → Forward to Claude Core</text>
<text x="292" y="179" font-size="11.5" fill="#6f6840">⚠️ BEFORE ACTIVATION:</text>
<text x="292" y="193" font-size="11.5" fill="#6f6840">1. Set wfC2WebhookUrl in ⚙️ Client Config to your n8n webhook URL (e.g. https://your-n8n.cloud/webhook/whatsapp-core)</text>
<text x="292" y="207" font-size="11.5" fill="#6f6840">2. Point Twilio WhatsApp sandbox/number inbound webhook to this workflow&#x27;s URL</text>
<text x="292" y="221" font-size="11.5" fill="#6f6840">3. Twilio credentials needed in WF-C4 (Send Reply) — not this workflow</text>

<text x="-348" y="15" font-size="11.5" fill="#6f6840">Google Sheets API, using the existing Google Sheets account OAuth…</text>
<text x="-348" y="29" font-size="11.5" fill="#6f6840">38 existing headers keep their original positions; 19 new ones are</text>
<text x="-348" y="43" font-size="11.5" fill="#6f6840">appended (incl. Email Verify Status, which v2 emitted but the sheet…</text>
<text x="-348" y="57" font-size="11.5" fill="#6f6840">Safe to re-run — it overwrites row 1 only, never touches data rows.</text>
<text x="-348" y="71" font-size="11.5" fill="#6f6840">Trigger: POST to the webhook path write-crm-headers.</text>

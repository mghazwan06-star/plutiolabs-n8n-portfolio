<text x="-348" y="-16.0" font-size="13.5" font-weight="700" fill="#5f5930">One-off utility — writes the CRM header row</text>
<text x="-348" y="1.0" font-size="11.5" fill="#6f6840">Writes all 57 headers to row 1 of the Outreach CRM tab via the</text>
<text x="-348" y="15.0" font-size="11.5" fill="#6f6840">Google Sheets API, using the existing Google Sheets account OAuth…</text>
<text x="-348" y="29.0" font-size="11.5" fill="#6f6840">38 existing headers keep their original positions; 19 new ones are</text>
<text x="-348" y="43.0" font-size="11.5" fill="#6f6840">appended (incl. Email Verify Status, which v2 emitted but the sheet…</text>
<text x="-348" y="57.0" font-size="11.5" fill="#6f6840">Safe to re-run — it overwrites row 1 only, never touches data rows.</text>
<text x="-348" y="71.0" font-size="11.5" fill="#6f6840">Trigger: POST to the webhook path write-crm-headers.</text>
